name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# One Pages deployment at a time. Two pushes in quick succession previously
# collided: the second run's deploy job was rejected with "in progress
# deployment" while the first still held the Pages slot. Cancelling the
# superseded run releases that slot immediately.
concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build

      # public/CNAME is copied into out/ by `next build`. Without it GitHub
      # Pages can drop the custom domain on the next deployment.
      - name: Verify the custom domain file survived the build
        run: |
          test -f out/CNAME
          diff <(printf 'shikshyatechhub.bikashkadayat.com.np') out/CNAME

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
