# Cloudflare Pages project configuration.
#
# `name` MUST match the Pages project name in your Cloudflare dashboard.
# Change it here and in .github/workflows/deploy.yml if you use a different one.
name = "shikshya-tech-hub"

# `next build` with `output: 'export'` writes the static site to ./out
pages_build_output_dir = "out"

compatibility_date = "2025-01-01"
